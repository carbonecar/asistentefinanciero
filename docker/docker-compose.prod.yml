services:
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-finassist}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-finassist_db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-finassist}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-finassist_db}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
