[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-assistant"
version = "0.1.0"
description = "Multi-agent financial assistant for Argentine retail investors"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "yfinance>=0.2.50",
    "PyPortfolioOpt>=1.5",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "newsapi-python>=0.2.7",
    "beautifulsoup4>=4.12",
    "redis>=5.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "textblob>=0.18",
    "httpx>=0.27",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
